name: etherealestate
description: "Ethereal Estate — luxury real estate app with glassmorphic design, Firebase Auth, and curated property listings."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.0.0
  glassmorphism: ^3.0.0
  cupertino_icons: ^1.0.8
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  firebase_crashlytics: ^4.1.0
  cloud_firestore: ^5.1.0
  firebase_messaging: ^15.1.0
  google_sign_in: ^6.1.0
  sqflite: ^2.3.0
  path: ^1.8.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  flutter_local_notifications: ^17.2.1
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.4.1
  http: ^1.2.0
  flutter_dotenv: ^5.2.1
  google_maps_flutter: ^2.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - .env

