            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);

<div class="w-full flex justify-center py-4">
<div class="w-12 h-1.5 rounded-full bg-on-surface-variant/20"></div>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-8 pb-10">
<div class="flex justify-between items-center mb-8">
<h2 class="font-headline font-bold text-2xl tracking-tight">Search Filters</h2>
<div class="flex items-center gap-4">
<button class="text-secondary font-semibold text-sm hover:opacity-70 transition-opacity">Reset</button>
<button class="p-2 rounded-full bg-surface-container-low hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface block">close</span>
</button>
</div>
</div>

<div class="mb-10">
<p class="font-bold text-sm uppercase tracking-widest text-on-surface/60 mb-4 px-1">Property Type</p>

<div class="absolute h-1.5 bg-secondary rounded-full" style="left: 20%; right: 30%;"></div>

<span>$10M+</span>

<button class="w-14 h-14 rounded-full border-2 border-outline-variant/30 flex items-center justify-center font-bold text-on-surface-variant hover:border-secondary transition-colors">3</button>
<button class="w-14 h-14 rounded-full border-2 border-outline-variant/30 flex items-center justify-center font-bold text-on-surface-variant hover:border-secondary transition-colors">4+</button>
</div>
</div>

<button class="w-full bg-primary py-5 rounded-[16pt] text-on-primary font-headline font-bold text-lg shadow-xl shadow-primary/20 active:scale-95 transition-transform">
